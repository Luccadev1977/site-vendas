<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redefina sua senha no Nexo Studio</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f3f5f9;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
    "
  >
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="
              max-width: 560px;
              background-color: #ffffff;
              border: 1px solid #e1e6ee;
              border-radius: 12px;
            "
          >
            <tr>
              <td
                style="
                  padding: 28px;
                  background-color: #0b1018;
                  color: #ffffff;
                  font-size: 21px;
                  font-weight: bold;
                "
              >
                Nexo Studio<span style="color: #7a9bff">.</span>
              </td>
            </tr>
            <tr>
              <td style="padding: 28px; font-size: 16px; line-height: 1.7">
                <p style="margin: 0 0 18px">Olá!</p>
                <p style="margin: 0 0 24px">
                  Recebemos uma solicitação para redefinir sua senha no Nexo Studio. Clique no botão
                  abaixo para escolher uma nova senha.
                </p>
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td bgcolor="#4269df" style="border-radius: 7px">
                      <a
                        href="{{ .RedirectTo }}#token_hash={{ .TokenHash }}&amp;type=recovery"
                        style="
                          display: inline-block;
                          padding: 15px 22px;
                          color: #ffffff;
                          text-decoration: none;
                          font-weight: bold;
                        "
                        >REDEFINIR MINHA SENHA</a
                      >
                    </td>
                  </tr>
                </table>
                <p style="margin: 26px 0 18px; color: #576174; font-size: 14px">
                  Se você não fez essa solicitação, ignore este e-mail. Sua senha continuará a
                  mesma.
                </p>
                <p style="margin: 0">Equipe Nexo Studio</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
