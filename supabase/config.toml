project_id = "nexo-studio"

[auth]
site_url = "https://luccadev1977.github.io/site-vendas/"
additional_redirect_urls = ["https://luccadev1977.github.io/site-vendas/conta/**", "http://127.0.0.1:3000/conta/**", "http://localhost:3000/conta/**"]
minimum_password_length = 8

[auth.email]
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirme sua conta no Nexo Studio"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefina sua senha no Nexo Studio"
content_path = "./supabase/templates/recovery.html"

[functions.finalize-upload]
verify_jwt = true
